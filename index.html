<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* 正文字体，已按信中用字做子集（源文件 text.ttf -> text.subset.woff2）。
       换字体或改信件内容后，在 letter contexts/forProfZJ 里重跑 python subset-font.py 即可，
       这里的字族名是中性的，无需跟着改。 */
    @font-face {
      font-family: 'LetterFont';
      src: url('text.subset.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --ink: #262b33;
      --ink-soft: #5b6472;
      --ink-faint: #939cab;
      --line: #d5dae2;
      --accent: #3a5a92;
      --accent-soft: rgba(58, 90, 146, 0.10);
      --paper: #fcfdfe;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'LetterFont', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      color: var(--ink);
      line-height: 2.15;
      min-height: 100vh;
      background: linear-gradient(168deg, #eef1f5 0%, #e6eaf1 55%, #dfe4ec 100%);
      overflow-x: hidden;
    }

    /* ---------- 背景：页帧网格（内存分页的隐喻，极淡） ---------- */
    .page-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(58, 90, 146, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(58, 90, 146, 0.055) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 20%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 20%, transparent 78%);
    }

    /* ---------- 启封页 ---------- */
    .gate {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      text-align: center;
      animation: fadeIn 1.2s ease-out;
      transition: opacity 0.7s ease;
    }
    .gate.leaving { opacity: 0; }

    /* 页帧矩阵：验证通过时逐格点亮 */
    .frames {
      display: grid;
      grid-template-columns: repeat(4, 26px);
      grid-gap: 7px;
      margin-bottom: 40px;
    }
    .frame {
      width: 26px; height: 26px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      transition: background-color 0.45s ease, border-color 0.45s ease, transform 0.45s ease;
    }
    .frame.on {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.06);
    }
    .frames.denied .frame {
      animation: denyFlash 0.5s ease;
    }
    @keyframes denyFlash {
      0%, 100% { border-color: var(--line); }
      35% { border-color: #b4553f; transform: translateX(-3px); }
      70% { border-color: #b4553f; transform: translateX(3px); }
    }

    /* 启封页的颜文字：不用正文字体（子集里没有这些符号），
       指定一套对假名/符号支持好的系统字体，各平台渲染才一致 */
    .gate h2 {
      font-family: 'Segoe UI Symbol', 'Yu Gothic', 'Meiryo', 'MS PGothic',
                   'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', sans-serif;
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: normal;
      text-indent: 0;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }
    .gate .sub {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      color: var(--ink-faint);
      margin-bottom: 44px;
    }
    .gate input {
      font-family: inherit;
      font-size: 1.02rem;
      width: 258px; max-width: 78vw;
      padding: 10px 4px;
      text-align: center;
      letter-spacing: 0.24em;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      outline: none;
      transition: border-color 0.3s;
    }
    .gate input::placeholder {
      font-family: var(--mono);
      color: var(--ink-faint);
      letter-spacing: 0.08em;
      font-size: 0.86rem;
    }
    .gate input:focus { border-bottom-color: var(--accent); }
    .gate button {
      margin-top: 32px;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 2px;
      padding: 9px 34px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .gate button:hover { background: var(--accent); color: #fff; }
    .gate button:disabled { opacity: 0.45; cursor: wait; }
    .gate .hint {
      margin-top: 20px;
      min-height: 1.6em;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: #a8543c;
    }
    .gate .hint.ok { color: var(--accent); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 信纸 ---------- */
    .container {
      display: none;
      position: relative;
      z-index: 1;
      max-width: 772px;
      margin: 60px auto 96px;
      padding: 74px 78px 66px;
      background: var(--paper);
      border: 1px solid #e2e6ed;
      border-radius: 2px;
      box-shadow: 0 20px 48px rgba(38, 43, 51, 0.09);
      animation: fadeIn 1.1s ease-out;
    }
    /* 顶部一道靛蓝细线，像文档的书脊 */
    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, var(--accent), rgba(58, 90, 146, 0.25));
    }
    /* 右上角文档元信息 */
    .meta {
      position: absolute;
      top: 26px; right: 30px;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--ink-faint);
    }

    #letterBox { position: relative; }

    .header { text-align: center; margin-bottom: 48px; }
    .header h1 {
      /* 标题不用正文字体：手写类中文字体普遍缺“劼”字，混排会一半手写一半宋体 */
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      font-size: 2.05rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: var(--ink);
    }
    /* 标题下的线：一段实线 + 一个方块，方块落在线外 */
    .rule {
      width: 96px; height: 1px;
      margin: 22px auto 0;
      background: var(--line);
      position: relative;
    }
    .rule::after {
      content: '';
      position: absolute;
      right: -16px; top: -2.5px;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 1px;
    }

    .salutation {
      font-size: 1.12rem;
      margin-bottom: 1.5em;
    }
    .paragraph {
      position: relative;
      font-size: 1.08rem;
      text-indent: 2em;
      text-align: justify;
      margin-bottom: 1.5em;
      color: #333941;
    }

    /* ---------- 引文：左老师的原话 ---------- */
    .quote {
      margin: 2.1em 0 2.1em 2em;
      padding: 0.15em 0 0.15em 1.5em;
      border-left: 2px solid var(--accent);
      text-indent: 0;
      font-size: 1.16rem;
      line-height: 2;
      letter-spacing: 0.03em;
      color: var(--ink);
    }
    .stress {
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* ---------- 页边地址：编到边界为止 ---------- */
    .paragraph[data-addr]::before {
      content: attr(data-addr);
      position: absolute;
      left: -54px;
      top: 0.6em;
      text-indent: 0;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      color: rgba(58, 90, 146, 0.30);
      pointer-events: none;
    }

    /* ---------- 阅读进度 ---------- */
    .progress {
      display: none;
      position: fixed;
      top: 0; left: 0;
      height: 2px; width: 0;
      background: linear-gradient(to right, rgba(58, 90, 146, 0.45), var(--accent));
      z-index: 20;
    }

    ::selection {
      background: rgba(58, 90, 146, 0.16);
      color: var(--ink);
    }

    /* ---------- 边界：虚线之下的内容越出边界 ---------- */
    .boundary {
      position: relative;
      height: 1px;
      margin: 54px 0 46px;
      border-top: 1px dashed #c9d0da;
    }
    .boundary::after {
      content: '';
      position: absolute;
      left: 50%; top: -4px;
      width: 7px; height: 7px;
      margin-left: -3.5px;
      background: var(--paper);
      border: 1px solid var(--accent);
      border-radius: 50%;
    }
    /* 越界：末尾几段比正文更宽，探出虚线框的范围 */
    .beyond {
      margin-left: -26px;
      margin-right: -26px;
    }
    .key-line {
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .closing {
      text-indent: 0;
      text-align: center;
      font-size: 1.16rem;
      letter-spacing: 0.2em;
      color: var(--ink);
      margin-top: 2.2em;
      margin-bottom: 0;
    }

    .signature {
      margin-top: 52px;
      text-align: right;
      color: var(--ink-soft);
      line-height: 2.05;
      font-size: 1.02rem;
    }
    .signature .name {
      font-size: 1.2rem;
      color: var(--ink);
      letter-spacing: 0.14em;
    }
    .signature .date {
      font-family: var(--mono);
      font-size: 0.86rem;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
    }

    /* 段落依次浮现 */
    .salutation, .paragraph, .quote, .signature, .boundary {
      opacity: 0;
      animation: riseIn 0.9s ease forwards;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 音乐按钮 ---------- */
    .music-btn {
      display: none;
      position: fixed;
      bottom: 28px; right: 28px;
      width: 44px; height: 44px;
      border-radius: 2px;
      border: 1px solid var(--line);
      background: rgba(252, 253, 254, 0.9);
      color: var(--accent);
      font-size: 1rem;
      cursor: pointer;
      align-items: center; justify-content: center;
      z-index: 10;
      transition: all 0.3s ease;
      backdrop-filter: blur(3px);
    }
    .music-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .music-btn.playing .icon { animation: sway 2.6s ease-in-out infinite; display: inline-block; }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-11deg); }
      70% { transform: rotate(11deg); }
    }

    /* 页边地址在窄屏没有空间，隐去 */
    @media (max-width: 1000px) {
      .paragraph[data-addr]::before { display: none; }
    }

    @media (max-width: 768px) {
      .container { margin: 22px 14px 64px; padding: 52px 26px 46px; }
      .header h1 { font-size: 1.6rem; }
      .paragraph { font-size: 1.02rem; }
      .quote { margin-left: 0.6em; padding-left: 1.1em; font-size: 1.08rem; }
      .beyond { margin-left: -10px; margin-right: -10px; }
      .meta { top: 18px; right: 18px; }
      .gate h2 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="page-grid"></div>
<div class="progress" id="progress"></div>

<!-- 启封页 -->
<div class="gate" id="gate">
  <div class="frames" id="frames"></div>
  <h2>( ´ ▽ ` )ﾉ</h2>
  <p class="sub">awaiting key</p>
  <input type="password" id="pwInput" placeholder="请输入访问密码" autocomplete="off">
  <button id="unlockBtn">验 证</button>
  <p class="hint" id="hint"></p>
</div>

<!-- 信纸：正文由解密后动态注入 #letterBox，源码中不存在明文 -->
<div class="container" id="letterWrap">
  <div class="meta">2026.07</div>
  <div id="letterBox"></div>
</div>

<audio id="bgMusic" loop>
  <source src="bg.flac" type="audio/flac">

  <source src="bg.m4a" type="audio/mp4">
  <source src="bg.mp4" type="audio/mp4">
  <source src="bg.ogg" type="audio/ogg">
</audio>

<button id="musicBtn" class="music-btn" title="播放 / 暂停音乐">
  <span class="icon">♪</span>
</button>

  const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decrypt(password) {
    const [saltB64, ivB64, ctB64] = ENCRYPTED.split('.');
    const salt = b64ToBuf(saltB64);
    const iv = b64ToBuf(ivB64);
    const ct = b64ToBuf(ctB64);

    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );
    // 密码错误时 AES-GCM 校验失败，这里会抛出异常
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plainBuf);
  }

  // ---------- 页帧矩阵 ----------
  const framesBox = document.getElementById('frames');
  for (let i = 0; i < 16; i++) {
    const f = document.createElement('div');
    f.className = 'frame';
    framesBox.appendChild(f);
  }
  const frameEls = [...framesBox.children];

  const gate = document.getElementById('gate');
  const pwInput = document.getElementById('pwInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const hint = document.getElementById('hint');
  const letterWrap = document.getElementById('letterWrap');
  const letterBox = document.getElementById('letterBox');
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const progress = document.getElementById('progress');
  let isPlaying = false;

  function updateProgress() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(1, window.scrollY / max) : 0;
    progress.style.width = (pct * 100).toFixed(2) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);

  function setMusicState(playing) {
    isPlaying = playing;
    musicBtn.classList.toggle('playing', playing);
    musicBtn.title = playing ? '暂停音乐' : '播放音乐';
  }

  async function tryUnlock() {
    const pw = pwInput.value.trim();
    if (!pw) { hint.textContent = '请输入密码'; hint.classList.remove('ok'); return; }
    unlockBtn.disabled = true;
    hint.textContent = '';
    hint.classList.remove('ok');
    try {
      const html = await decrypt(pw);

      // 音乐随验证通过开始（借助本次点击的用户交互）
      audio.volume = 0.3;
      audio.play().then(() => setMusicState(true)).catch(() => setMusicState(false));

      // 页帧逐格点亮 → 过渡到信纸
      hint.textContent = 'key accepted';
      hint.classList.add('ok');
      frameEls.forEach((f, i) => {
        setTimeout(() => f.classList.add('on'), i * 55);
      });

      setTimeout(() => gate.classList.add('leaving'), 16 * 55 + 320);
      setTimeout(() => {
        gate.style.display = 'none';
        letterBox.innerHTML = html;
        letterWrap.style.display = 'block';
        musicBtn.style.display = 'flex';
        document.title = letterBox.querySelector('h1')?.textContent || document.title;
        realTitle = document.title;

        // 页边地址：从 0x00 编起，到那道边界为止（越界之后不再编址）
        const boundary = letterBox.querySelector('.boundary');
        let addr = 0;
        letterBox.querySelectorAll('.paragraph').forEach(p => {
          const beforeBoundary = boundary &&
            (p.compareDocumentPosition(boundary) & Node.DOCUMENT_POSITION_FOLLOWING);
          if (beforeBoundary) {
            p.dataset.addr = '0x' + addr.toString(16).toUpperCase().padStart(2, '0');
            addr++;
          }
        });

        // 段落依次浮现
        letterBox.querySelectorAll('.salutation, .paragraph, .quote, .boundary, .signature')
          .forEach((el, i) => {
            el.style.animationDelay = (0.25 + i * 0.22) + 's';
          });

        // 阅读进度
        progress.style.display = 'block';
        updateProgress();
      }, 16 * 55 + 1000);
    } catch (e) {
      hint.textContent = 'key rejected';
      hint.classList.remove('ok');
      framesBox.classList.remove('denied');
      void framesBox.offsetWidth; // 重新触发动画
      framesBox.classList.add('denied');
      pwInput.select();
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      audio.pause();
      setMusicState(false);
    } else {
      audio.play().then(() => setMusicState(true)).catch(() => {
        musicBtn.title = '播放失败：请确认音乐已放入本文件夹';
      });
    }
  });

  // ---------- 标签页标题的小表情 ----------
  // 切走时换成一张丧脸，切回来先笑一下，两秒后恢复原标题
  let realTitle = document.title;
  let titleTimer = null;
  document.addEventListener('visibilitychange', () => {
    clearTimeout(titleTimer);
    if (document.hidden) {
      document.title = '（；´д｀）ゞ 别走呀…';
    } else {
      document.title = 'ヾ(^▽^*))) 欢迎回来！';
      titleTimer = setTimeout(() => { document.title = realTitle; }, 2000);
    }
  });

  // 循环兜底：有些音频文件（例如 STREAMINFO 里总采样数为 0 的 FLAC）
  // 浏览器读不到时长、无法定位到开头，原生 loop 属性会失效。
  // 此时 ended 会触发，重新加载再播即可继续循环。
  audio.addEventListener('ended', () => {
    audio.load();
    audio.play().then(() => setMusicState(true)).catch(() => setMusicState(false));
  });
</script>
